name: Android CI

on:
  push:
    branches: [ main, feature/ishihara-gate-cff-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate CI shell scripts
        run: |
          sh -n .github/scripts/run-emulator-tests.sh
          sh -n .github/scripts/verify-avd-metadata.sh
          sh -n .github/scripts/test-avd-metadata.sh
          sh .github/scripts/test-avd-metadata.sh
          bash -n .github/scripts/check-16k-alignment.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 37.0
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle from the checked-in wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK and instrumentation APK
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify 16 KB native library alignment
        run: bash .github/scripts/check-16k-alignment.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload app and instrumentation APKs for emulator matrix
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Pro-test-bundle
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  instrumented:
    name: Compose UI tests on Android API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            image-api-level: "24"
            image-target: default
          - api-level: 35
            image-api-level: "35"
            image-target: google_apis
          - api-level: 37
            image-api-level: "37.0"
            image-target: google_apis_ps16k
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SERIAL: emulator-5554
      API_LEVEL: ${{ matrix.api-level }}
      IMAGE_API_LEVEL: ${{ matrix.image-api-level }}
      IMAGE_TARGET: ${{ matrix.image-target }}
      ANDROID_CMDLINE_TOOLS_VERSION: "22.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download prebuilt app and instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: EyeCare-Pro-test-bundle
          path: artifacts

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and pin Android command-line tools 22.0
        run: |
          BOOTSTRAP_SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          yes | "$BOOTSTRAP_SDKMANAGER" --install "cmdline-tools;22.0"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          echo "Pinned Android command-line tools version: $("$SDKMANAGER" --version)"
      - name: Install Android emulator and system image
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${IMAGE_API_LEVEL};${IMAGE_TARGET};x86_64"

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo modprobe kvm || true
          if grep -q "GenuineIntel" /proc/cpuinfo; then
            sudo modprobe kvm_intel || true
          elif grep -q "AuthenticAMD" /proc/cpuinfo; then
            sudo modprobe kvm_amd || true
          fi
          sudo udevadm trigger --name-match=kvm --action=add
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner did not expose a usable KVM device; hardware-accelerated x86_64 emulator tests cannot run here."
            grep -m1 -E "vendor_id|flags" /proc/cpuinfo | cut -c1-240 || true
            lsmod | grep -E "^kvm" || true
            dmesg | grep -i kvm | tail -n 20 || true
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check

      - name: Run Compose UI tests on hardware-accelerated emulator
        run: sh .github/scripts/run-emulator-tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            test-results/instrumentation-api-${{ matrix.api-level }}.txt
            test-results/logcat-api-${{ matrix.api-level }}.txt
            test-results/dropbox-api-${{ matrix.api-level }}.txt
            ${{ runner.temp }}/eyecare-emulator-api-${{ matrix.api-level }}.log
          if-no-files-found: warn
          retention-days: 7
