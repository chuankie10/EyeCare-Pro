name: Android CI

on:
  push:
    branches: [ main, feature/ishihara-gate-cff-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 37.0
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle from the checked-in wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  instrumented:
    name: Compose UI tests on Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # AOSP image keeps the legacy API 24 emulator independent of old
          # Google APIs packages that can stall on current hosted runners.
          - api-level: 24
            image-api-level: "24"
            image-target: default
          - api-level: 35
            image-api-level: "35"
            image-target: google_apis
          # Android 17 16 KB page-size image also exercises bundled native libraries.
          - api-level: 37
            image-api-level: "37.0"
            image-target: google_apis_ps16k
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SERIAL: emulator-5554
      API_LEVEL: ${{ matrix.api-level }}
      IMAGE_API_LEVEL: ${{ matrix.image-api-level }}
      IMAGE_TARGET: ${{ matrix.image-target }}
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android emulator and system image
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${IMAGE_API_LEVEL};${IMAGE_TARGET};x86_64"

      - name: Set up Gradle from the checked-in wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compose UI tests on managed emulator
        # Keep this as one command. The emulator script itself contains the
        # multi-line POSIX logic and owns emulator startup, readiness and cleanup.
        run: sh .github/scripts/run-emulator-tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7
