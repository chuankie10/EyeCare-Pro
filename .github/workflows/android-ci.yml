name: Android CI

on:
  push:
    branches: [ main, feature/ishihara-gate-cff-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 37.0
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  instrumented:
    name: Compose UI tests on Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35, 37]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install compile SDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Compose UI smoke tests on Android API ${{ matrix.api-level }} emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # API 37 currently uses the 16 KB Google APIs system image.
          api-level: ${{ matrix.api-level == 37 && '37.0' || matrix.api-level }}
          system-image-api-level: ${{ matrix.api-level == 37 && '37.0' || matrix.api-level }}
          target: ${{ matrix.api-level == 37 && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 1200
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none -camera-front none'
          # Do not let the runner mutate system animation/spellchecker settings.
          disable-animations: false
          disable-spellchecker: false
          script: |
            # android-emulator-runner executes this block through /usr/bin/sh,
            # not Bash. Keep the readiness script strictly POSIX-compatible.
            set -eu
            adb wait-for-device

            # ADB can report "device" before Android has registered system
            # providers. Wait for PackageManager and Settings before installing
            # the test APK; this avoids false UTP install failures during boot.
            ready=0
            for attempt in $(seq 1 150); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              package_ready="no"
              settings_ready="no"
              adb shell pm list packages >/dev/null 2>&1 && package_ready="yes" || true
              adb shell settings get system screen_brightness >/dev/null 2>&1 && settings_ready="yes" || true

              if [ "$boot_completed" = "1" ] && [ "$package_ready" = "yes" ] && [ "$settings_ready" = "yes" ]; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              echo "Emulator did not finish booting system providers."
              adb shell getprop sys.boot_completed || true
              adb shell pm list packages || true
              adb shell settings get system screen_brightness || true
              exit 1
            fi

            adb shell pm list packages | sed -n '1,5p'
            gradle --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7
